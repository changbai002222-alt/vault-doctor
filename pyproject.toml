[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-doctor"
dynamic = ["version"]
description = "Health checks for Obsidian vaults: broken links, missing frontmatter, empty notes, BOM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vault-doctor = "vault_doctor.cli:main"

[tool.setuptools]
packages = ["vault_doctor"]

[tool.setuptools.dynamic]
version = { attr = "vault_doctor.__version__" }
